{% extends 'main.html' %}

{% block content %}

<div class="edit-profile-page">

    <div class="edit-profile-card">

        <div class="edit-profile-header">
            <div class="edit-avatar">
                {{ user.username|first|upper }}
            </div>

            <div>
                <h1>Edit Profile</h1>
                <p>Update your developer profile.</p>
            </div>
        </div>


        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    value="{{ user.username }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Bio</label>

                <textarea
                    name="bio"
                    rows="6"
                    placeholder="Tell other developers about yourself..."
                >{{ profile.bio }}</textarea>

            </div>


            <div class="form-actions">

                <a
                    href="{% url 'profile' user.id %}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>


<style>

/* ========================= */
/* Page */
/* ========================= */

.edit-profile-page {
    max-width: 700px;
    margin: 30px auto;
}


/* ========================= */
/* Card */
/* ========================= */

.edit-profile-card {
    background: #ffffff;

    border: 1px solid #e2e8f0;
    border-radius: 14px;

    padding: 30px;
}


/* ========================= */
/* Header */
/* ========================= */

.edit-profile-header {
    display: flex;
    align-items: center;
    gap: 15px;

    padding-bottom: 25px;
    margin-bottom: 25px;

    border-bottom: 1px solid #f1f5f9;
}

.edit-profile-header h1 {
    margin: 0;

    font-size: 25px;
    color: #0f172a;
}

.edit-profile-header p {
    margin: 5px 0 0;

    color: #64748b;
    font-size: 13px;
}


/* ========================= */
/* Avatar */
/* ========================= */

.edit-avatar {
    width: 55px;
    height: 55px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #334155;
    color: white;

    font-size: 21px;
    font-weight: 700;

    flex-shrink: 0;
}


/* ========================= */
/* Form */
/* ========================= */

.form-group {
    margin-bottom: 22px;
}

.form-group label {
    display: block;

    margin-bottom: 7px;

    color: #334155;

    font-size: 13px;
    font-weight: 600;
}

.form-group input,
.form-group textarea {
    width: 100%;

    box-sizing: border-box;

    padding: 11px 12px;

    border: 1px solid #cbd5e1;
    border-radius: 7px;

    background: #f8fafc;

    color: #0f172a;

    font-family: inherit;
    font-size: 14px;

    outline: none;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #2563eb;
    background: #ffffff;
}

.form-group textarea {
    resize: vertical;
    line-height: 1.6;
}


/* ========================= */
/* Buttons */
/* ========================= */

.form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;

    padding-top: 20px;

    border-top: 1px solid #f1f5f9;
}

.cancel-btn,
.save-btn {
    padding: 9px 15px;

    border-radius: 7px;

    font-size: 13px;
    font-weight: 600;

    text-decoration: none;

    cursor: pointer;
}

.cancel-btn {
    background: #f1f5f9;
    color: #475569;
}

.cancel-btn:hover {
    background: #e2e8f0;
}

.save-btn {
    border: none;

    background: #0f172a;
    color: white;
}

.save-btn:hover {
    background: #1e293b;
}


/* ========================= */
/* Mobile */
/* ========================= */

@media (max-width: 700px) {

    .edit-profile-page {
        margin: 15px;
    }

    .edit-profile-card {
        padding: 22px;
    }

    .form-actions {
        justify-content: stretch;
    }

    .cancel-btn,
    .save-btn {
        flex: 1;
        text-align: center;
    }

}

</style>

{% endblock content %}
