{% extends 'main.html' %}

{% block content %}

<h2>Delete Blog</h2>

<p>Are you sure you want to delete "{{ blog.title }}"?</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">Yes, Delete</button>

    <a href="{% url 'blog' blog.id %}">
        Cancel
    </a>
</form>

{% endblock content %}
