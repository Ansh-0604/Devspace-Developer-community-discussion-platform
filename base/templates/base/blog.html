{% extends 'main.html' %}

{% block content %}

<div class="blog-detail-page">

    <article class="blog-card">

        <!-- Header -->
        <div class="blog-header">

            <div class="blog-category">
                {{ blog.category }}
            </div>

            <h1>{{ blog.title }}</h1>

            <div class="blog-meta">
                <div class="blog-avatar">
                    {{ blog.user.username|first|upper }}
                </div>

                <div>
                    <span class="blog-user">
                        @{{ blog.user.username }}
                    </span>

                    <small>
                        {{ blog.created|date:"M d, Y" }}
                    </small>
                </div>
            </div>

        </div>


        <!-- Content -->
        <div class="blog-content">
            {{ blog.content|linebreaks }}
        </div>


        <!-- Actions -->
        <div class="blog-actions">

            <a
                href="{% url 'update-blog' blog.id %}"
                class="edit-button"
            >
                Edit
            </a>

            <a
                href="{% url 'delete-blog' blog.id %}"
                class="delete-button"
            >
                Delete
            </a>

        </div>

    </article>

</div>


<style>

/* ========================= */
/* Page */
/* ========================= */

.blog-detail-page {
    max-width: 850px;
    margin: 0 auto;
}


/* ========================= */
/* Blog Card */
/* ========================= */

.blog-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    overflow: hidden;
}


/* ========================= */
/* Header */
/* ========================= */

.blog-header {
    padding: 30px 32px 24px;
    border-bottom: 1px solid #f1f5f9;
}

.blog-category {
    display: inline-block;

    background: #eff6ff;
    color: #2563eb;

    padding: 5px 9px;
    border-radius: 5px;

    font-size: 11px;
    font-weight: 600;

    margin-bottom: 12px;
}

.blog-header h1 {
    margin: 0 0 18px;

    font-size: 32px;
    line-height: 1.3;

    color: #0f172a;
}


/* ========================= */
/* Author */
/* ========================= */

.blog-meta {
    display: flex;
    align-items: center;
    gap: 10px;
}

.blog-avatar {
    width: 36px;
    height: 36px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #334155;
    color: white;

    font-size: 14px;
    font-weight: 600;
}

.blog-user {
    display: block;

    color: #334155;
    font-size: 13px;
    font-weight: 600;
}

.blog-meta small {
    color: #94a3b8;
    font-size: 11px;
}


/* ========================= */
/* Content */
/* ========================= */

.blog-content {
    padding: 30px 32px;

    color: #475569;

    font-size: 16px;
    line-height: 1.8;
}

.blog-content p {
    margin: 0 0 18px;
}


/* ========================= */
/* Actions */
/* ========================= */

.blog-actions {
    display: flex;
    gap: 10px;

    padding: 18px 32px;

    border-top: 1px solid #f1f5f9;
}

.blog-actions a {
    text-decoration: none;

    padding: 8px 14px;

    border-radius: 7px;

    font-size: 13px;
    font-weight: 600;
}

.edit-button {
    background: #2563eb;
    color: white;
}

.edit-button:hover {
    background: #1d4ed8;
}

.delete-button {
    background: #fee2e2;
    color: #b91c1c;
}

.delete-button:hover {
    background: #fecaca;
}


/* ========================= */
/* Mobile */
/* ========================= */

@media (max-width: 700px) {

    .blog-header {
        padding: 22px;
    }

    .blog-header h1 {
        font-size: 26px;
    }

    .blog-content {
        padding: 22px;
    }

    .blog-actions {
        padding: 15px 22px;
    }

}

</style>

{% endblock content %}
