{% extends 'main.html' %}

{% block content %}

<div class="profile-layout">

    <!-- Sidebar -->
    <aside class="profile-sidebar">
        {% include 'base/sidebar.html' %}
    </aside>


    <!-- Profile -->
    <main class="profile-page">

        <div class="profile-card">

            <!-- Profile Header -->
            <div class="profile-header">

                <div class="profile-avatar">
                    {{ user.username|first|upper }}
                </div>

                <div class="profile-info">
                    <h1>@{{ user.username }}</h1>
                    <span>Developer</span>
                </div>

            </div>


            <!-- Bio -->
            {% if profile and profile.bio %}

                <div class="profile-bio">
                    <p>{{ profile.bio }}</p>
                </div>

            {% else %}

                <div class="profile-bio empty-bio">
                    <p>No bio added yet.</p>
                </div>

            {% endif %}


            <!-- Actions -->
            <div class="profile-actions">

                <a
                    href="{% url 'edit-profile' %}"
                    class="edit-profile-btn"
                >
                    Edit Profile
                </a>

            </div>

        </div>

    </main>

</div>


<style>

/* ========================= */
/* Layout */
/* ========================= */

.profile-layout {
    display: grid;
    grid-template-columns: 1fr 4fr;
    padding: 10px;
}

.profile-page {
    padding: 20px;
}


/* ========================= */
/* Profile Card */
/* ========================= */

.profile-card {
    max-width: 850px;

    background: #ffffff;

    border: 1px solid #e2e8f0;
    border-radius: 14px;

    padding: 30px;

    margin: 0 auto;
}


/* ========================= */
/* Header */
/* ========================= */

.profile-header {
    display: flex;
    align-items: center;
    gap: 18px;

    padding-bottom: 24px;
    border-bottom: 1px solid #f1f5f9;
}

.profile-avatar {
    width: 70px;
    height: 70px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #334155;
    color: white;

    font-size: 26px;
    font-weight: 700;

    flex-shrink: 0;
}

.profile-info h1 {
    margin: 0;

    font-size: 26px;
    color: #0f172a;
}

.profile-info span {
    display: block;

    margin-top: 5px;

    color: #64748b;
    font-size: 13px;
}


/* ========================= */
/* Bio */
/* ========================= */

.profile-bio {
    padding: 22px 0;

    color: #475569;
    font-size: 15px;
    line-height: 1.7;
}

.profile-bio p {
    margin: 0;
}

.empty-bio {
    color: #94a3b8;
    font-style: italic;
}


/* ========================= */
/* Actions */
/* ========================= */

.profile-actions {
    padding-top: 18px;

    border-top: 1px solid #f1f5f9;
}

.edit-profile-btn {
    display: inline-block;

    padding: 9px 15px;

    background: #0f172a;
    color: white;

    text-decoration: none;

    border-radius: 7px;

    font-size: 13px;
    font-weight: 600;

    transition: 0.2s ease;
}

.edit-profile-btn:hover {
    background: #1e293b;
}


/* ========================= */
/* Mobile */
/* ========================= */

@media (max-width: 700px) {

    .profile-layout {
        grid-template-columns: 1fr;
    }

    .profile-page {
        padding: 10px;
    }

    .profile-card {
        padding: 22px;
    }

}

</style>

{% endblock content %}
