<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyBlog</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f8fafc;
            color: #0f172a;
        }

        /* Navbar */
        .navbar {
            background: #354365;
            color: white;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
        }

        /* Logo */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: 700;
            font-style: oblique;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: #38bdf8;
            color: #0f172a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Search */
        .search-container {
            flex: 1;
            max-width: 500px;
        }

        .search-box {
            width: 100%;
            padding: 0.65rem 1rem;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
            background: #1e293b;
            color: white;
        }

        .search-box::placeholder {
            color: #94a3b8;
        }

        .search-box:focus {
            box-shadow: 0 0 0 2px #38bdf8;
        }

        /* Write Button */
        .write-btn {
            color: white;
            text-decoration: none;
            font-weight: 600;
            padding: 0.55rem 1rem;
            border: 1px solid #38bdf8;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .write-btn:hover {
            background: #38bdf8;
            color: #0f172a;
        }

        /* Profile */
        .profile {
            position: relative;
        }

        .profile summary {
            list-style: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile summary::-webkit-details-marker {
            display: none;
        }

        .profile-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #38bdf8;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .profile-name {
            color: white;
            font-weight: 500;
        }

        /* Dropdown */
        .dropdown {
            position: absolute;
            right: 0;
            top: 50px;
            width: 180px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .dropdown a {
            display: block;
            padding: 12px 16px;
            color: #0f172a;
            text-decoration: none;
        }

        .dropdown a:hover {
            background: #f1f5f9;
        }

        /* Main Content */
        .content {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* Responsive */
        @media (max-width: 700px) {
            .nav-container {
                gap: 1rem;
            }

            .profile-name {
                display: none;
            }

            .search-container {
                max-width: none;
            }

            .navbar {
                padding: 1rem;
            }

            .logo {
                font-size: 1.2rem;
            }

            .write-btn {
                padding: 0.5rem 0.7rem;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">

        <div class="nav-container">

            <!-- Logo -->
            <a href="{% url 'home' %}" class="logo">
                <span class="logo-icon">D</span>
                DevSpace
            </a>

            <!-- Search -->
            <div class="search-container">
                <form method="GET" action="{% url 'home' %}">
                    <input type="text" name="q" placeholder="Search..." class="search-box">
                </form>
            </div>

            <!-- Write -->
            <a href="{% url 'create-blog' %}" class="write-btn">
                + Write
            </a>

            <a href="{% url 'create-project' %}" class="write-btn">
                + Project
            </a>

            <!-- Profile -->
            <details class="profile">

                <summary>
                    {% if request.user.is_authenticated %}
                    <span class="profile-icon">
                        {{ request.user.username|slice:":1"|capfirst }}
                    </span>
                
                    <span class="profile-name">
                        {{ request.user.username }}
                    </span>
                    {% else %}
                    <span class="profile-name">Login</span>
                    {% endif %}
                </summary>
                
                <div class="dropdown">
                
                    {% if request.user.is_authenticated %}
                
                    <a href="{% url 'profile' request.user.id %}">
                        Profile
                    </a>
                
                    <a href="#">
                        My Blogs
                    </a>
                
                    <a href="{% url 'logout' %}">
                        Logout
                    </a>
                
                    {% else %}
                
                    <a href="{% url 'login' %}">
                        Login
                    </a>
                
                    {% endif %}
                
                </div>

            </details>

        </div>

    </header>

</body>
</html>
